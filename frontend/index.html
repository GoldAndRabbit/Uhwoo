<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-agent-werewolf</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <!-- 左栏 -->
  <aside class="col sidebar">
    <label class="field">模式
      <select id="modeSel">
        <option value="sim" selected>模拟模式 · 6 个 agent 自己打</option>
        <option value="play">单人模式</option>
      </select>
    </label>
    <label class="field" id="roleField" hidden>身份
      <select id="roleSel">
        <option value="" selected>随机（推荐）</option>
        <option value="狼人">狼人</option>
        <option value="预言家">预言家</option>
        <option value="守卫">守卫</option>
        <option value="平民">平民</option>
      </select>
    </label>
    <div id="meCard" class="me" hidden></div>
    <label class="field">模型
      <select id="modelSel"></select>
    </label>
    <label class="check"><input type="checkbox" id="ttsOn"> 自动朗读发言内容</label>
    <button id="btnStart" class="btn primary">开一局</button>
    <button id="btnStop" class="btn ghost" disabled>停止这一局</button>

    <div class="sec-head"><span class="caret">▾</span> 玩家 <span class="sec-right" id="aliveCount">0/0 存活</span></div>
    <div id="players" class="players">
      <div class="prow sys" data-seat="sys">
        <span class="pname">系统全局状态</span>
        <span class="pmeta">0 次调用</span>
      </div>
    </div>

    <div class="sec-head"><span class="caret">▾</span> 历史对话 <span class="sec-right" id="histCount">0</span></div>
    <div id="history" class="history"></div>
    <button id="btnNew" class="btn dashed">+ 新建对话</button>
    <div class="foot">购物车 / 记忆 / 暂存队列都随对话保留</div>
  </aside>

  <!-- 中栏 -->
  <section class="col center">
    <div class="col-head">
      <span>每轮上下文与输出</span>
      <span class="col-head-right"><b id="callCount">0</b> 次调用</span>
    </div>
    <div class="filter-bar" id="filterBar" hidden>
      只看 <b id="filterName"></b><button id="filterClear">显示全部</button>
    </div>
    <div id="calls" class="calls"></div>
  </section>

  <!-- 右栏 -->
  <section class="col right">
    <div class="mebar" id="meBar" hidden>
      <span id="meBarText"></span>
      <span class="mebar-btns">
        <button id="barStop">停止</button>
        <button id="barNew">重开</button>
      </span>
    </div>
    <div id="log" class="log"></div>
    <div class="ask" id="ask" hidden>
      <div class="ask-head"><b id="askTitle"></b><span id="askLeft" class="ask-left"></span></div>
      <div class="ask-body" id="askBody"></div>
    </div>
  </section>
</div>
<nav class="mobnav">
  <button data-tab="side" class="active">玩家</button>
  <button data-tab="ctx">上下文<span class="n" id="navCalls">0</span></button>
  <button data-tab="log">事件流</button>
</nav>
<script src="/static/app.js"></script>
</body>
</html>
