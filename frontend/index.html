<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-agent-werewolf</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="tabbar">
  <div class="tab">Agent</div>
  <div class="tab active">Multi-agent-werewolf <span class="tab-badge" id="tabBadge">0</span></div>
  <div class="tab-fill"></div>
  <div class="tab-note" id="modelNote">…</div>
</div>

<div class="app">
  <!-- 左栏 -->
  <aside class="col sidebar">
    <p class="blurb">每个 agent 各有各的视野：全局一条事件流，每条带 audience，谁看得到谁看不到由它决定。</p>

    <div class="start-card">
      <div class="start-title">开一局</div>
      <div class="start-desc">约 30~40 次模型调用、两三分钟。狼队夜里的商议和预言家的查验都看得到。</div>
    </div>
    <button id="btnStart" class="btn primary">开一局</button>
    <button id="btnStop" class="btn ghost" disabled>停止这一局</button>

    <div class="sec-head"><span class="caret">▾</span> 玩家 <span class="sec-right" id="aliveCount">0/0 存活</span></div>
    <div id="players" class="players">
      <div class="prow sys" data-seat="sys">
        <span class="pname">系统全局状态</span>
        <span class="pmeta">0 次调用</span>
      </div>
    </div>

    <div class="sec-head"><span class="caret">▾</span> 历史对话 <span class="sec-right" id="histCount">0</span></div>
    <div id="history" class="history"></div>
    <button id="btnNew" class="btn dashed">+ 新建对话</button>
    <div class="foot">购物车 / 记忆 / 暂存队列都随对话保留</div>
  </aside>

  <!-- 中栏 -->
  <section class="col center">
    <div class="col-head">
      <span>每轮上下文与输出</span>
      <span class="col-head-right"><b id="callCount">0</b> 次调用</span>
    </div>
    <div class="filter-bar" id="filterBar" hidden>
      只看 <b id="filterName"></b><button id="filterClear">显示全部</button>
    </div>
    <div id="calls" class="calls"></div>
  </section>

  <!-- 右栏 -->
  <section class="col right">
    <div id="log" class="log"></div>
    <div class="runbar" id="runbar" hidden>
      <span class="dots"><i></i><i></i><i></i></span>
      <span id="runText"></span>
    </div>
  </section>
</div>
<script src="/static/app.js"></script>
</body>
</html>
