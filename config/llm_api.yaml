# LLM API（OpenAI 兼容）。鉴权环境变量名由代码约定，不写在本文件：
#   - 阿里云百炼  ：ALIYUN_BAILIAN_API_KEY
#   - SiliconFlow ：SILICONFLOW_API_KEY
# 可以写进项目根的 .env（不会覆盖已存在的环境变量）。

aliyun:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  default_model: qwen3.8-flash
  models:
    - qwen3.8-flash
    - qwen3.8-max
    - qwen3.6-flash
    - qwen3.6-plus

siliconflow:
  base_url: https://api.siliconflow.cn/v1
  default_model: Qwen/Qwen3.6-35B-A3B

# 狼人杀 agent 用哪一家、哪个模型。
#   enable_thinking: 仅对 Qwen3 混合思考模型有意义。这里每次调用要的是一段 JSON，
#                    模型自己的 thinking 字段已经承担了推理，关掉思考更快更便宜。
#   一局约 30~40 次调用，flash 足够；想要更强的推理可以换 qwen3.8-max。
werewolf:
  provider: aliyun
  model: qwen3.8-flash
  enable_thinking: false
  timeout: 90
