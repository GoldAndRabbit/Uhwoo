# LLM API（OpenAI 兼容）。鉴权环境变量名由代码约定，不写在本文件：
#   - 阿里云百炼  ：ALIYUN_BAILIAN_API_KEY
#   - SiliconFlow ：SILICONFLOW_API_KEY
# 可以写进项目根的 .env（不会覆盖已存在的环境变量）。

aliyun:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  default_model: qwen3.8-flash
  models:
    - qwen3.8-flash
    - qwen3.8-max
    - qwen3.6-flash
    - qwen3.6-plus

siliconflow:
  base_url: https://api.siliconflow.cn/v1
  default_model: Qwen/Qwen3.6-35B-A3B

# 生图（火山引擎方舟 Seedream）。鉴权：ARK_API_KEY（兼容 ARK_VOLCENGINE_API_KEY /
# VOLCENGINE_API_KEY 两个别名），同样可以写进项目根的 .env。
# 方舟的硬限制：下限 3,686,400 像素、上限 4,624,220 像素（超了直接 400），
# 下面每一档都是该比例在这个区间里能取到的最大值。
ark:
  base_url: https://ark.cn-beijing.volces.com/api/v3
  image_model: doubao-seedream-5-0-pro-260628
  models:
    - doubao-seedream-5-0-pro-260628     # 5.0 pro，默认
    - doubao-seedream-5-0-260128         # 5.0 全量
    - doubao-seedream-4-5-251128
  watermark: false
  timeout: 180
  sizes:
    role: 2144x2144         # 1:1    身份牌 / 座位头像
    bg: 2864x1608           # 16:9   背景板
    sprite: 1608x2856       # 9:16   竖版立绘

# 狼人杀 agent 用哪一家、哪个模型。models 是 UI 下拉框里的候选，model 是默认值。
#   enable_thinking: 仅对 Qwen3 混合思考模型有意义。这里每次调用要的是一段 JSON，
#                    模型自己的 thinking 字段已经承担了推理，关掉思考更快更便宜。
werewolf:
  provider: aliyun
  model: deepseek-v4-flash
  models:
    - deepseek-v4-flash
    - qwen3.8-flash
  enable_thinking: false
  timeout: 90

# 朗读发言。鉴权用 DASHSCOPE_API_KEY，没有就退回 ALIYUN_BAILIAN_API_KEY。
#   实测（同一句 23 字）：flash 首包 353ms / 整句 0.74s，plus 首包 496ms / 整句 1.33s。
#   慢一倍换来的音质差别在一局狼人杀里听不出来，所以用 flash。
#   音色：两档模型都只有 longanhuan_v3.6 一个预置音色能用（其它名字一律 RequestFailure），
#   它是 203Hz 的女声 —— 所以「多样化」靠两条路：下面的 presets 用音高/语速把人分开，
#   或者打开音色克隆，一人一把真嗓子。
tts:
  enabled: true
  model: qwen-audio-3.0-tts-flash
  voice: longanhuan_v3.6

  # ⚠️ 实测：这档模型**忽略 pitch_rate / speech_rate**（0.70 和 1.12 出来的基频都是
  # 184–232Hz，和参数无关，那两个参数是 CosyVoice 的），而且只有 longanhuan_v3.6 一个
  # 预置音色能用。所以 flash 这一档，6 个人 + 法官是同一把女声，没法分开。
  # 真要一人一把嗓子、而且男声配男头像，只有两条路（都比 flash 慢）：
  #   - 打开下面的 clone：真人克隆音色，约 2.4s/句
  #   - 换 cosyvoice-v1：20 个预置音色（longxiaochun/longwan/longcheng/longhua/longshuo/
  #     longtong/loongstella… 男女都有），首包 606ms、整句 1.17s
  # flash 是 首包 353ms、整句 0.74s —— 现在默认按「最快」走。
  #
  # 座位的音色槽位（f0–f2 / m0–m2，性别跟着头像走，见 Game.voices）只在 clone 那档起作用：
  # 同性别的三个人各拿一把，不撞车。

  # 音色克隆：参考音频是 pitchasso 那批真人素材（frontend/ref_audio/*.wav），
  # 通过 https://uhwoo.com/static/ref_audio/*.wav 注册给 DashScope，
  # 注册一次就行，之后 voice id 和预置音色一样用（重新注册见 scripts/enroll_voices.py）。
  # 模型用 cosyvoice-v3.5-flash：实测首包 790ms、整句 1.65s，比 cosyvoice-v2 的
  # 1200ms / 2.40s 快三分之一（v3.5 不认预置音色，只能用注册出来的）。
  # 默认开着：一人一把真嗓子值这 0.9s。想要更快就在左栏切「快速语音模式」（flash，0.74s/句）。
  # 括号里是实测基频（自相关估的），男女按这个分池，不是按名字猜的。
  clone:
    default_on: true
    model: cosyvoice-v3.5-flash
    judge: cosyvoice-v3.5-flash-uhwoo-49d2d2b148d54d10b0660266d968194f   # wu_gang 119Hz
    m:
      - cosyvoice-v3.5-flash-uhwoo-5a9f80b0d1fb4efe9b3abc1be5f859da       # zhan_jun 143Hz
      - cosyvoice-v3.5-flash-uhwoo-1d293bb09e5f4bc69c68513794a4fb4c       # xu_jing_yu 115Hz
      - cosyvoice-v3.5-flash-uhwoo-6ae3ef1887bf42f9a852c55cc99f1b04       # wang_chu_qi 170Hz
    f:
      - cosyvoice-v3.5-flash-uhwoo-449263d0e9064820a05342f0e439f060       # gao_yuan_yuan 200Hz
      - cosyvoice-v3.5-flash-uhwoo-7299bc11b94a475489c821bfe9ba1913       # lin_zhi_lin 219Hz
      - cosyvoice-v3.5-flash-uhwoo-2d58fcd0ebdc4a07b675f58fb7395e9d       # dee_hsu 219Hz

# 语音输入。同一把 DashScope key，qwen-audio-3.0-asr-flash-streaming 是最快的一档。
#   websocket_url: 只有需要指定业务空间（workspace）或地域时才填，
#                  形如 wss://<workspace-id>.cn-beijing.maas.aliyuncs.com/api-ws/v1/inference
asr:
  enabled: true
  model: qwen-audio-3.0-asr-flash-streaming
  sample_rate: 16000
  # websocket_url:
